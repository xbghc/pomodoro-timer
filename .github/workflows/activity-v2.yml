name: Activity v2 tests

on:
  pull_request:
  push:
    branches: [feat/activity-schedule-v2]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test activity core, desktop orchestration, and calendar
        run: node --test
      - name: Check renderer syntax
        run: node --check src/renderer/activity.js
